[mod]
id = "villager_names"
version = "0.1.0"
priority = 100

# The rendering adapters depend on this revision's model and animation layout.
[compatibility]
horizon_revision = "36f4bc00d6fc644f1ad118ddd926a997a034cb48"

[[module]]
id = "villager_names"
file = "crates/horizon-client/src/lib.rs"
name = "villager_names"
source = "runtime.rs"
visibility = "pub"

# One module per region, so each region's names live in a file of their own.
